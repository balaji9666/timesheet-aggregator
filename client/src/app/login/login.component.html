<div class="login-container">
  <div class="login-card">

    <div class="login-header">
      <h1>Workflow - Timesheet Aggregator</h1>
      <p>Please enter your workflow credentials to continue</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-group">
        <div class="input-wrapper">
          <i class="email-icon"></i>
          <input
            type="text"
            id="login_name"
            formControlName="login_name"
            placeholder="Login Name"
            [class.is-invalid]="login_name?.invalid && login_name?.touched"
          />
        </div>
        <div class="error-message" *ngIf="login_name?.invalid && login_name?.touched">
          <span *ngIf="login_name?.errors?.['required']">Login Name is required</span>
          <span *ngIf="login_name?.errors?.['minlength']">Login Name must be at least 3 characters</span>
        </div>
      </div>

      <div class="form-group">
        <div class="input-wrapper">
          <i class="password-icon"></i>
          <input
            type="password"
            id="password"
            formControlName="password"
            placeholder="Password"
            [class.is-invalid]="password?.invalid && password?.touched"
          />
          <button type="button" class="toggle-password" (click)="togglePasswordVisibility()">
            <i class="visibility-icon"></i>
          </button>
        </div>
        <div class="error-message" *ngIf="password?.invalid && password?.touched">
          <span *ngIf="password?.errors?.['required']">Password is required</span>
          <span *ngIf="password?.errors?.['minlength']">Password must be at least 6 characters</span>
        </div>
      </div>


      <button
        type="submit"
        class="get-started-button"
        [disabled]="loginForm.invalid || isLoading()"
      >
        <span *ngIf="!isLoading()">Continue</span>
        <span *ngIf="isLoading()" class="loading-spinner"></span>
      </button>
    </form>
  </div>
</div>
